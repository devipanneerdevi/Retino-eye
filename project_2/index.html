<!DOCTYPE html>
<html>
<head>
    <title>Diabetic Retinopathy Screening</title>
</head>

<body>

    <h1>Diabetic Retinopathy Screening</h1>

    <input type="file" id="imageInput" accept="image/*">

    <br><br>

    <img id="preview" width="300" style="display:none;">

    <br><br>

    <button onclick="analyzeImage()">Analyze Image</button>

    <div id="result"></div>

    <script>
        document.getElementById("imageInput").addEventListener("change", function () {

            const file = this.files[0];
            const preview = document.getElementById("preview");

            if (file) {
                preview.src = URL.createObjectURL(file);
                preview.style.display = "block";
            }
        });

        function analyzeImage() {

            const file = document.getElementById("imageInput").files[0];
            const result = document.getElementById("result");

            if (!file) {
                result.innerHTML = "<p>Please upload a retinal image first.</p>";
                return;
            }

            result.innerHTML = `
                <h2>Analysis Result</h2>
                <p><b>DR Level:</b> Level 2 - Moderate DR</p>
                <p><b>Status:</b> Referable Diabetic Retinopathy</p>
                <p><b>Confidence:</b> 92%</p>
                <p><b>Explanation:</b> Possible retinal lesions detected.</p>
            `;
        }
    </script>

</body>
</html>
